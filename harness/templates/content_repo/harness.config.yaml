# harness.config.yaml - settings for this content repository.
# Created by `harness init`; change it with `harness config set <key> <value>`.
# Checked against my-harness/harness/schemas/config.schema.json.
schema_version: 1
owner: owner

language:
  # Language the harness writes in.
  working: en
  # Keep content in the language you originally wrote it, next to the working-language copy.
  preserve_original: true

capture:
  # Context window size used to turn token counts into a usage percent
  # (a larger window is detected automatically when a conversation exceeds it).
  context_window_tokens: 200000
  # Do the slow work (capture, transcript, commit, push) in the background, so you never wait.
  background: true

capture_modes:
  # How each kind of tool is captured (one line per adapter type, for every account):
  #   push      - the tool sends while you work (hooks); nothing to schedule
  #   scheduled - checked every N minutes (data that lives on one computer, or files that arrive)
  #   on_demand - only when you run `harness harvest <tool>` (the source is always reachable
  #               and reading it costs no tokens)
  # `harness sources` shows them; run `harness update` after a change.
  claude-code: {mode: push}
  cowork: {mode: on_demand}    # Cowork now runs in the cloud: saved by the account skill; this reads local files
  claude-ai: {mode: scheduled, every_minutes: 30}
  monday: {mode: on_demand}

checkpoints:
  # A checkpoint refreshes the rolling session summary (sessions/<tool>/<id>/summary.md).
  # There is no reliable "end of conversation", so the summary is kept current instead.
  # A checkpoint is due when ANY trigger below fires. Set a trigger to 0 to turn it off.
  enabled: true
  # Every N of your messages since the last checkpoint (also covers running out of plan quota).
  every_user_messages: 10
  # Every time context usage grew by this many percentage points since the last checkpoint.
  every_context_percent: 20
  # One last forced checkpoint when context usage reaches this level, before tokens run out.
  force_at_context_percent: 80
  # Also when the tool compacts the conversation.
  on_compaction: true
  # Upper bound the model is asked to keep the summary under.
  summary_max_words: 600

git:
  # Commit to this repository after every capture.
  auto_commit: true
  # Push to the remote (at every checkpoint and when a session ends).
  auto_push: true
  # Also push after every turn, so nothing waits on this machine (needed in cloud sessions,
  # which can disappear between checkpoints).
  push_every_turn: true

harvest:
  # Capture what you build inside tools (instructions, skills, agents, memory, connections).
  enabled: true
  # Items to skip, as '<kind>:<name>' patterns, e.g. 'skill:pdf' or 'plugin:data'.
  # Add one with: harness config add harvest.exclude skill:pdf
  # Kinds: instruction, skill, agent, memory, connection, plugin, native.
  # Skip what you did not build (e.g. Anthropic's skills and plugins): it is reinstalled, not copied.
  # A skipped plugin is still listed under connections, so you know to install it elsewhere.
  exclude: []

storage:
  # Full transcripts (saved every turn) never go into the main branch. They go to:
  #   filesystem: a folder; a cloud-synced one (OneDrive, Google Drive) = cloud storage, no API keys.
  #   git: a branch of a repository (remote 'origin' = this repository), reachable from anywhere.
  # A profile that cannot reach the default (e.g. a cloud session) gets its own under storage_by_profile.
  transcripts:
    backend: filesystem
    path: ~/harness-storage/transcripts

claude_ai:
  # The Claude account (claude.ai, Claude Desktop, Cowork) is saved by the harness-account skill.
  # A data export (for the history before it) is imported when found in this folder.
  watch_folder: ~/Downloads
  # File name pattern of a claude.ai export.
  file_pattern: data-*.zip
  # Keep a copy of every export file in transcript storage.
  archive_exports: true
  # The harness-account skill (claude.ai, Claude Desktop, Cowork) writes into this Google Drive
  # folder; inbox_folder is where this computer sees it (the Google Drive for desktop copy).
  drive_folder: my-harness-inbox
  inbox_folder: ~/my-harness-inbox
  # The claude.ai page opened for uploading the export skill.
  skills_page: https://claude.ai/new#customize/skills/new/upload
  # Where the export skill file is written for you to upload (empty = your desktop).
  skill_folder: ~/Downloads

monday:
  # monday.com API address.
  endpoint: https://api.monday.com/v2
  # API version. Agents are only available in the preview version ("dev") today.
  api_version: dev
  # How many recent runs (conversations) of each agent are kept in sync.
  runs_per_agent: 50

assets:
  # Larger files are stored outside Git and referenced from assets/<id>/asset.yaml.
  max_inline_size_mb: 10

tools:
  - claude-code
