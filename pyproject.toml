[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-harness"
version = "0.26.2"
description = "A tool-agnostic engine for keeping your AI harness (instructions, skills, memory, sessions) portable across AI tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ruamel.yaml>=0.18",  # YAML that keeps comments when the engine edits a file
    "jsonschema>=4.18",
    "referencing>=0.30",
    "rfc3339-validator>=0.1.4",  # enables "format: date-time" checks
    "keyring>=24",  # API tokens in the operating system's password store
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
# Schemas and the content-repo template ship inside the package so that
# `harness init` works from any install location.
harness = ["schemas/*.json", "templates/**/*", "templates/**/.*", "templates/content_repo/.github/workflows/*.yml", "adapters/*/skill/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.exclude-package-data]
harness = ["**/__pycache__/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
